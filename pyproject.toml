[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishcheck"
version = "0.1.0"
description = "Offline heuristic phishing analyser for .eml files"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Lawrence Tshabalala"}]
dependencies = []

[project.scripts]
phishcheck = "phishcheck.cli:main"

[tool.setuptools.packages.find]
include = ["phishcheck*"]
